<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jason's Game — A Classic Platform Adventure</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 18%, #2a2f6b 0%, #0a0e2e 60%, #05071a 100%);
    color: #e8ecf6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 96px 24px; }
  h1 { font-size: 3.4rem; letter-spacing: 1px; margin: 24px 0 8px; color: #ffd147;
       text-shadow: 0 0 30px rgba(255,209,71,0.35); }
  .tag { font-size: 1.2rem; color: #c7cee0; margin-bottom: 40px; }
  .moon {
    width: 110px; height: 110px; border-radius: 50%; margin: 0 auto;
    background: radial-gradient(circle at 38% 36%, #eafcff, #8bd8e8 55%, #3f6fae);
    box-shadow: 0 0 60px rgba(143,216,232,0.5);
  }
  ul { list-style: none; padding: 0; max-width: 420px; margin: 0 auto 40px; text-align: left; }
  li { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  li::before { content: "▲ "; color: #6fb8ff; }
  a.btn { display: inline-block; background: #ffd147; color: #1a1200; font-weight: 700;
          text-decoration: none; padding: 14px 30px; border-radius: 999px;
          box-shadow: 0 0 24px rgba(255,209,71,0.5); }
  .links { margin-top: 28px; }
  .links a { color: #9199c2; margin: 0 12px; font-size: 0.9rem; }
  footer { margin-top: 64px; color: #7178a0; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="moon"></div>
    <h1>JASON'S GAME</h1>
    <p class="tag">A classic run-and-jump platform adventure.</p>
    <ul>
      <li>Dodge rolling barrels and dive-bombing planes</li>
      <li>Jump, crouch, and time every leap across the platforms</li>
      <li>Simple touch controls, no accounts, no ads, no tracking</li>
    </ul>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
    </div>
    <footer>© 2026 Jason Stoops. Jason's Game.</footer>
  </div>
</body>
</html>
